[[profile.default.overrides]]
filter = 'binary(presence_memory)'
success-output = "immediate-final"
junit = { store-success-output = true }
retries = 0

# Raise the kill deadline for the upload memory envelope's post-release tests
# (b.26e F tests 11 and 11c: `post_release_*`, on a standalone store and, as
# `post_release_cluster_*`, on a cluster). Each repeats one upload on its own
# client until every connection the case can use has carried it, plus two
# calls, reading the heap after each: the field-dense WATCH case on a pool of
# 8 makes eleven 20,000-field WATCH commits, and the ignored case runner can
# run several cases in one test. Measured on the healthy path in a debug
# build, pinned to four CPUs: 45 s at a pool of 2, 55 s at 4, 87 s at 8 (the
# longest), and about 50 s for the cold start's four 20,000-child reads, on
# a standalone store; the cluster cases are not measured here (no cluster in
# the dev sandbox). 60s × 5 = 300s.
# Their figures are allocation counts, not times, so the retries stay off
# (the `upload_memory_envelope` binary entry above). Verify the match set —
# the thirteen live `post_release_*` tests (seven cluster-gated) and the ignored
# case runner — with
# `cargo nextest list -p live-edit --features test-support --run-ignored all -E '<filter>'`.
[[profile.default.overrides]]
filter = 'binary(upload_memory_envelope) and test(/^post_release_/)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }

