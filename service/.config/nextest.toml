# CPUs with one other envelope test beside it: 95.6 s, too near the default
# 120 s kill for a loaded runner. 60s × 5 = 300s. Its figures are allocation
# counts, not times, so the retries stay off (the binary entry above). Verify
# the filter matches exactly that one test with
# `cargo nextest list -p live-edit --features test-support -E '<filter>'`.
[[profile.default.overrides]]
filter = 'binary(upload_memory_envelope) and test(=update_layer_slow_path_watch_all_uploads_stay_within_their_charge)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }

# Raise the kill deadline for the upload memory envelope's stream-repair
# handler rows (b.fsz T7, `cached_hit_repairing_*`): each creates its base
# layer, warms the cache, has a second store commit the pending records and
# measures the cache hit's repair, most of them twice (a twin run, then the
# measured one). Measured on the healthy path in a debug build: the
# index-resize row (256 records under a parent of 4,096 children)
# 97.5–98.0 s, the long-list row (D2) 65.1–65.2 s, the full-sections-table
# row (D1) 59.7–60.4 s, the 3 MiB-record rows about 28.8 s — the first too
# near the default 120 s kill for a loaded runner, D1 and D2 past half of
# it. 60s × 5 = 300s, the whole family, so a row added to it is covered with
# no edit here. Its figures are allocation counts, not times, so the retries
# stay off (the binary entry above, whose settings this entry does not set,
# so their order does not matter: nextest takes each setting from the first
# override that sets it for a test). Verify the filter matches every
# `cached_hit_repairing_*` test, and nothing else, with
# `cargo nextest list --profile ci -p live-edit --features oodf-ffi/internal-bridge,test-fault-injection,test-checkpoint-fault-injection,test-support --test upload_memory_envelope -E '<filter>'`.
[[profile.default.overrides]]
filter = 'binary(upload_memory_envelope) and test(/^cached_hit_repairing_/)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }

# At most two at a time of the upload memory envelope's large-base b.26e
# reproducers (`slow_path_*_stay(s)_within_(its|their)_charge_b26e`). Each
# creates its base layer — up to 20,000 children or 64,000 fields, the harness-shaped layer, or
# 20,000 `obj:ext` hashes — on the one store the run shares, and four such
# creations at once made one base's `EXEC` time out (it passed alone). Their
# in-process measurement lock cannot serialize them: nextest runs each test in
# its own process. In the default profile so it applies under `--profile ci`
# too. Verify the filter matches exactly the fourteen of them in both of CI's
# feature shapes (none of them is gated on `test-fault-injection`) with
# `cargo nextest list -p live-edit --features test-support -E '<filter>'` and
# the same with `--features test-support,test-fault-injection`. The M3 arms and
# three b.fsz stream-repair rows join the group in the two entries below. The
# group is declared under `[test-groups]` at the end of this file.
[[profile.default.overrides]]
filter = 'binary(upload_memory_envelope) and test(/^slow_path_.*_within_(its|their)_charge_b26e$/)'
test-group = 'upload-envelope-large-base'

# The upload memory envelope's M3 arms (b.26e Stage 2, `m3_*_b26e`: several
# one-new-child structural `UpdateLayer`s at once on one gate) join the
# large-base group above: each creates its large base layers on the one store
# the run shares, the hazard that group bounds — the demo arms (`m3_a*`, live,
# 5.6 to 13 s each in a debug build pinned to six CPUs) six 5,000-child layers
# (A1, A4) or two (A2, A3), the stress arms (`m3_b*`) two 20,000-child layers
# (B1) or seventeen (B2, B3). Verify the filter matches exactly
# the seven of them — four live, three ignored — with
# `cargo nextest list -p live-edit --features test-support --run-ignored all -E '<filter>'`.
[[profile.default.overrides]]
filter = 'binary(upload_memory_envelope) and test(/^m3_/)'
test-group = 'upload-envelope-large-base'

# Three of the stream-repair handler rows (b.fsz T7) join the large-base
# group too: the full-sections-table row (D1) creates two 28,670-child base
# layers and the long-list row (D2) two of 30,000 children (a twin run and
# the measured one, each on its own base), on the one store the run shares
# — the hazard the group bounds — and the index-resize row creates two
# 4,096-child bases and commits and repairs 256 records on each, the
# longest of the family (about 98 s). Verify the filter matches exactly
# these three with
# `cargo nextest list --profile ci -p live-edit --features oodf-ffi/internal-bridge,test-fault-injection,test-checkpoint-fault-injection,test-support --test upload_memory_envelope -E '<filter>'`.
[[profile.default.overrides]]
filter = 'binary(upload_memory_envelope) and (test(=cached_hit_repairing_a_creation_into_a_full_sections_table_stays_within_its_charge_fsz) or test(=cached_hit_repairing_a_child_added_to_a_long_list_stays_within_its_charge_fsz) or test(=cached_hit_repairing_256_prims_under_a_parent_of_4096_children_stays_within_its_charge_fsz))'
test-group = 'upload-envelope-large-base'

# The M3 stress arms (`m3_b*_b26e`: sixteen calls at once on 20,000-child
# bases) are `#[ignore]`d — each takes about 2 to 3 minutes in a debug build
# pinned to six CPUs — and run by hand, one at a time:
# `cargo nextest run -p live-edit --features test-support --test upload_memory_envelope --run-ignored all --test-threads 1 -E '<filter>'`.
# Raised kill deadline, 300s × 4 = 20 min, for a loaded host. Verify the
# filter matches exactly the three of them with
# `cargo nextest list -p live-edit --features test-support --run-ignored all -E '<filter>'`.
[[profile.default.overrides]]
filter = 'binary(upload_memory_envelope) and test(/^m3_b/)'
slow-timeout = { period = "300s", terminate-after = 4, grace-period = "5s" }

# The release-build stack guard (`tests/release_stack_guard/`, the
# `test-release-stack-guard:` CI job) keeps its output on a PASS: each case
# prints one line — the route, its measured stack depth, the budget, the usable
# stack and the headroom — and those figures are what to read when a route's
# depth grows toward the budget. `retries = 0`: stack depth varies by well
# under 1 KiB between runs of one build, so a retry cannot turn a breach green
# and only doubles a red run. Every test in the binary is `#[ignore]`d in a
# debug build, so a debug run (the `test:` job's included) lists them as
# skipped; they run under `--cargo-profile release`. In the default profile,
# so it covers CI's `--profile ci` run too (see the restart-storm entry
# above). The filter matches the binary; verify with
# `cargo nextest list --cargo-profile release -p live-edit --features test-support -E 'binary(release_stack_guard)'`.
[[profile.default.overrides]]
filter = 'binary(release_stack_guard)'
success-output = "immediate-final"
junit = { store-success-output = true }
retries = 0

# The disruptive tests that change the server configuration of the ONE Valkey
# they share — the `test-cluster-disruptive:` job's `valkey-disruptive`
# service, named by `LIVE_EDIT_TEST_DISRUPTIVE_VALKEY_URL` — run one at a time.
# `stream_mux_disruptive_*` sets `timeout 2`, which would close the idle
# connections of the others; every `store_write_refusal_disruptive_*` test
# (`store_write_refusal_test`, b.yvh, and `oom_collection_test`, b.pa1) sets
# `maxmemory` at or below what the store holds, which would refuse the
# others' writes. Each restores its setting when it ends, but nextest runs
# tests in parallel processes, and no in-process lock reaches across them:
# the test group is what keeps one's setting out of another's run. All are
# `#[ignore]`d, so outside that job (`--run-ignored all` with its `-E` filter)
# the group holds nothing. The regex matches every test named with the
# `store_write_refusal_disruptive_` prefix, so a new one joins the group by
# its name. In the default profile so it applies under `--profile ci` too.
# Verify the filter matches exactly the stream-multiplexer test and every
# `store_write_refusal_disruptive_` test with
# `cargo nextest list --profile ci -p live-edit --test integration --features test-support,test-fault-injection --run-ignored all -E '<filter>'`
# (`stream_mux_health_test` and the b.ua9 full-store test need
# `test-fault-injection`). The group itself is declared under `[test-groups]`
# at the end of this file.
[[profile.default.overrides]]
filter = 'test(=storage::stream_mux_health_test::stream_mux_disruptive_idle_readers_outlive_the_idle_timeout_only_with_the_keepalive) or test(/store_write_refusal_disruptive_/)'
test-group = 'disruptive-valkey-config'

# The report-only cluster measurement of fred's connection-buffer sweep
# (b.26e: `retention_sweep_cost_on_a_cluster_is_reported_b26e`, in the
# integration binary, `#[ignore]`d and run only by the `test-cluster-disruptive:`
# job). It asserts nothing about its figures: its `SWEEP-COST:` lines are the
# reason it runs, and nextest prints nothing for a passing test by default, so
# `immediate-final` keeps them in the log (inline and in the final summary) and
# `store-success-output` puts them in the JUnit XML, the durable copy. In the
# default profile so it applies under `--profile ci` too, and to a local run
# against a cluster. The name is matched by an end-anchored regex, so the
# override holds wherever in the binary the test lives. The cluster
# measurement of fred's check before a write (b.bo2 PD2:
# `write_check_cost_on_a_cluster_is_within_its_budget_bbo2`, run in the same
# release-build step) asserts its budget, but its `WRITE-CHECK-COST:` figures
# are read from a passing run too, so it shares the override. Verify it
# matches exactly these two tests with
# `cargo nextest list --profile ci -p live-edit --test integration --features test-support --run-ignored all -E '<filter>'`
[[profile.default.overrides]]
filter = 'test(/retention_sweep_cost_on_a_cluster_is_reported_b26e$/) or test(/write_check_cost_on_a_cluster_is_within_its_budget_bbo2$/)'
success-output = "immediate-final"
junit = { store-success-output = true }

# The report-only tombstone-regime probe of the structural cache's plan
# indexes (b.5h3: `natural_tables_in_the_tombstone_regime_are_counted_at_this_width`,
# in `tests/proptests.rs`). It asserts nothing about its counts: its
# `REGIME-PROBE` lines, each naming the hash group width it ran at, are the
# reason it runs — CI's x86_64 runs give the width-16 figures a developer's
# aarch64 machine cannot — and nextest prints nothing for a passing test by
# default, so `immediate-final` keeps them in the log and
# `store-success-output` in the JUnit XML. In the default profile so it
# applies under `--profile ci` too. Verify it matches exactly this one test
# with `cargo nextest list -p live-edit --features test-support --test proptests -E '<filter>'`.
[[profile.default.overrides]]
filter = 'test(=in_place_plan_equivalence::natural_tables_in_the_tombstone_regime_are_counted_at_this_width)'
success-output = "immediate-final"
junit = { store-success-output = true }

# One test at a time across the tests that share the `test-cluster-disruptive:`
# job's 3-shard cluster: the `cluster_subscriber_disruptive_*` tests pause a
# node (`CLIENT PAUSE`) and migrate a slot, which stall or reroute every client
# of that shard, and the sweep-cost report above times commands on the same
# cluster, so a pause or migration overlapping it would be measured as sweep
# cost. The group also keeps the two disruptive tests from disturbing each
# other's cluster. All are `#[ignore]`d, so outside that job (`--run-ignored
# all` with its `-E` filter) the group holds nothing. In the default profile so
# it applies under `--profile ci` too. Verify the filter with the `nextest list`
# command above: it matches the `cluster_subscriber_disruptive_*` tests and the
# sweep-cost report. The group is declared under `[test-groups]` at the end of
# this file.
#
# `snapshot_read_cluster_test`'s
# `snapshot_read_disruptive_structural_read_falls_back_to_plain_commands_during_a_slot_migration`
# (b.gvf) migrates a slot too, and joins the group; the job's `-E` filter in
# `.gitlab-ci.yml` must name it for the job to run it. So do the tests whose
# names contain `slot_migration_disruptive` (b.vn4: a slot staged `MIGRATING`
# under multi-key commands, which meet the real `-TRYAGAIN`), matched anywhere
# in the name, as the job's filter matches them. So do the
# `fed_frame_flush_disruptive_*` tests (b.gbt: `CLIENT PAUSE` on a node a
# reconnect waits on), matched the same way. So does the write-check cost
# measurement (b.bo2), for the sweep-cost report's reason: a pause or
# migration overlapping it would be timed as the check's cost.
[[profile.default.overrides]]
filter = 'test(/cluster_subscriber_disruptive/) or test(/retention_sweep_cost_on_a_cluster_is_reported_b26e$/) or test(/write_check_cost_on_a_cluster_is_within_its_budget_bbo2$/) or test(=storage::snapshot_read_cluster_test::snapshot_read_disruptive_structural_read_falls_back_to_plain_commands_during_a_slot_migration) or test(/slot_migration_disruptive/) or test(/fed_frame_flush_disruptive/)'
test-group = 'disruptive-cluster'

[profile.ci]
# Same hang kill-switch as the default profile.
slow-timeout = { period = "40s", terminate-after = 3, grace-period = "5s" }

# One retry in CI as well. This absorbs the documented shared-Valkey + CPU
# contention flake class (a test that times out on TRY 1 under a load spike and
# passes in <1s on TRY 2) so a contention blip does not redden the pipeline.
#
# This does NOT silently hide problems: nextest reports a TRY-1-fail/TRY-2-pass
# test as FLAKY (not "passed") in both the run summary and the JUnit report
# below, so the residual contention class (tracked in b.bfo) stays visible for
# follow-up. A genuine intermittent bug that fails both attempts still fails the
# job. Raising deadlines further is explicitly the wrong lever (b.bfo) — this
# retry plus the hang kill-switch is the chosen backstop.
retries = 1

# JUnit output for GitLab's test report / flaky-test surfacing. Written to
# `target/nextest/ci/junit.xml`; the `test` and `test-cluster` jobs wire it via
# `artifacts.reports.junit`, and `.rust-integration-base` also publishes the raw
# XML as a downloadable artifact path (the `reports:` mapping alone is parsed
# into GitLab's test tab but is NOT browsable).
[profile.ci.junit]
path = "junit.xml"

# Keep the output of a small set of PASSING tests (b.cv4).
#
# nextest's default — and the right default — is to print nothing for a test
# that passed. The filter below reaches EIGHT tests. Two of them exist to REPORT
# a measurement rather than to assert one, and for those the default silently
# discards the entire reason the test was run:
#
#   * `cluster_subscriber_disruptive_ask_redirect_during_slot_migration` (B2)
#     writes a `B2 DATAPOINT:` line saying which fred error a real slot
#     migration surfaces. It is deliberately reported and not asserted, so that
#     the job's red/green stays a verdict on the b.c7a contract and on B1, which
#     shares the job. The first real cluster run (pipeline 64932151) proved the
#     hole: the job was GREEN, the eprintln had run, and the datapoint was
#     unreadable — suppressed precisely because the test passed, which is the
#     only case it was built for.
#   * `cluster_subscriber_observed_errors_are_all_classified_transient` (A6)
#     writes an `A6 DATAPOINT:` line naming the real error shapes a cluster
#     disturbance produced and which of them survived only via a message-matched
#     carve-out. Same shape: useful on success, invisible by default.
#
# The third — `cluster_subscriber_disruptive_node_pause_wedges_and_self_heals`
# (B1) — is an ORDINARY asserting regression test with no datapoint of its own.
# It is in scope because the `disruptive` glob is the honest way to name "the
# tests in that job", and keeping it is deliberate rather than incidental: B1
# shares a job and a cluster with B2, so when B2's datapoint needs interpreting,
# B1's output from the same run is the context that says whether the cluster was
# healthy while B2 measured. A few extra lines, one fewer re-run.
#
# The last five — `snapshot_read_cluster_test`'s
# `object_snapshot_read_answers_for_an_object_on_every_shard` and
# `snapshot_read_self_test_passes_on_every_shard` (b.y3m Epic 2 Task 4),
# `structural_read_window_scripts_answer_for_an_object_on_every_shard` and
# `snapshot_read_disruptive_structural_read_falls_back_to_plain_commands_during_a_slot_migration`
# (b.gvf), and `snapshot_fence_cluster_test`'s
# `snapshot_fence_scripts_run_for_an_object_on_every_shard` (b.y3m Epic 3
# Task 2) — are asserting tests whose PASS is ambiguous without their output:
# each returns early after `SKIP:` when `LIVE_EDIT_TEST_CLUSTER_URL` is unset,
# and nextest records that as a pass. Each prints `CLUSTER-GATED RAN: <test>
# shards=<n>` when it actually ran, and the stored output is the evidence (read
# by the release gate against these names) that the cluster jobs exercised the
# atomic snapshot read, its startup self-test, the structural WATCH read's
# window scripts and their fallback during a slot migration (the
# `test-cluster-disruptive:` job), and the six snapshot-fence scripts on every
# shard.
#
# Beyond those eight, every test whose name contains `slot_migration_disruptive`
# (b.vn4: multi-key commands under a slot staged `MIGRATING`, meeting the real
# `-TRYAGAIN`, in the `test-cluster-disruptive:` job) or
# `fed_frame_flush_disruptive` (b.gbt: a write fed behind a reconnect to a
# paused node, in the same job) is matched by pattern, as that job's filter
# selects them, for the same reason: a cluster-gated pass is ambiguous without
# its `CLUSTER-GATED RAN:` line.
#
# `immediate-final` prints the output inline AND repeats it in the final
# summary, so it survives a long scrollback; `store-success-output` puts the
# same text in the JUnit XML, which is the durable copy (job logs expire, and
# the XML is an artifact).
#
# This is scoped to exactly these eight and those two patterns on purpose. Making
# the whole ci profile verbose would bury them again.
#
# Note on `test(=…)`: nextest's exact-match operator matches the FULL
# binary-relative test name, module path included — a bare function name matches
# nothing and fails open (silently no override). Verify any edit here with
# `cargo nextest list --profile ci -p live-edit --test integration --run-ignored all -E '<filter>'`
# and count the results; the expected match set is exactly eight: the two
# `cluster_subscriber_disruptive_*` tests, A6, the four
# `snapshot_read_cluster_test` tests and the `snapshot_fence_cluster_test` test,
# plus each `slot_migration_disruptive` and `fed_frame_flush_disruptive` test.
# The b.gvf disruptive test is compiled only with `test-fault-injection`, so
# list with that feature to count it.
[[profile.ci.overrides]]
filter = 'test(/cluster_subscriber_disruptive/) or test(=storage::cluster_subscriber_test::cluster_subscriber_observed_errors_are_all_classified_transient) or test(=storage::snapshot_read_cluster_test::object_snapshot_read_answers_for_an_object_on_every_shard) or test(=storage::snapshot_read_cluster_test::snapshot_read_self_test_passes_on_every_shard) or test(=storage::snapshot_read_cluster_test::structural_read_window_scripts_answer_for_an_object_on_every_shard) or test(=storage::snapshot_read_cluster_test::snapshot_read_disruptive_structural_read_falls_back_to_plain_commands_during_a_slot_migration) or test(=storage::snapshot_fence_cluster_test::snapshot_fence_scripts_run_for_an_object_on_every_shard) or test(/slot_migration_disruptive/) or test(/fed_frame_flush_disruptive/)'
success-output = "immediate-final"
junit = { store-success-output = true }

# One test at a time for the tests that change the shared disruptive Valkey's
# configuration, and for the tests that share the disruptive job's cluster; see
# the `disruptive-valkey-config` and `disruptive-cluster` overrides in the
# default profile above. Two at a time for the upload memory envelope's
# large-base reproducers, M3 arms and large-base stream-repair rows; see the
# `upload-envelope-large-base` overrides.
[test-groups]
disruptive-valkey-config = { max-threads = 1 }
disruptive-cluster = { max-threads = 1 }
upload-envelope-large-base = { max-threads = 2 }
