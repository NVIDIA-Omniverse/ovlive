# cargo-nextest configuration.
#
# Two jobs this file does:
#
# 1. Global hang kill-switch. Several integration tests are timing-sensitive
#    (subscriber catch-up rendezvous, checkpoint-durability waits) and run
#    against a Valkey instance that, under load, is hit by many tests at once.
#    Under heavy contention a stalled stream read or rendezvous could otherwise
#    block the whole run indefinitely. `slow-timeout.terminate-after` guarantees
#    that can never happen: any test exceeding the deadline is killed and
#    reported as a timeout failure (naming the offending test), so the run
#    always terminates.
#
# 2. Process-per-test isolation. nextest runs each test in its own process, so a
#    process-global `static` (e.g. the `APPLY_STEP_FAULT_INJECTORS` seam in
#    src/checkpoint/session.rs) cannot bleed across tests the way it does under
#    `cargo test`'s in-process parallelism. This is a correctness property, not
#    just speed.
#
# Both CI (`test` / `test-cluster` jobs) and local/agent narrow verification run
# through nextest so the two environments behave identically — "green locally"
# means "green in CI". The in-test `tokio::time::timeout` bounds remain as
# defence-in-depth (they turn a stall into a fast, descriptive failure on the
# happy path); this config guarantees termination even if a future test forgets
# its bound.
#
# Test threads run on an 8 MiB stack (`RUST_MIN_STACK`), under every profile
# here, default and `ci` alike. It is set in `.cargo/config.toml`'s `[env]`
# table, which nextest passes to every test process; this file has no stable
# environment setting. Debug-build stack overflows are not a product signal
# (release WATCH handler: 86 KB; the unboxed upload-envelope WATCH test passes
# on a 192 KiB release thread). The reasoning is at that `[env]` entry. What
# pins the product's depth is the release-build stack guard,
# `tests/release_stack_guard` (its override is below), which the
# `test-release-stack-guard` CI job builds in release. Its measured threads and
# runtime set explicit stack sizes, so `RUST_MIN_STACK` does not reach them,
# and its thread-bounds self-check fails if it ever did.

[profile.default]
# Mark a test "slow" (emit a still-running line) at 40s, and hard-terminate it
# after 3 such periods = 120s. The longest legitimate test in this suite is the
# checkpoint-recovery e2e family at ~15s under load, so 120s is comfortable
# headroom while making a true deadlock impossible to leave hanging.
slow-timeout = { period = "40s", terminate-after = 3, grace-period = "5s" }

# Surface flaky-under-load failures without masking them: a single automatic
# retry distinguishes a genuine logic failure (fails twice) from a contention
# blip (passes on retry), and the final summary still flags the retried test.
retries = 1

# Raise the kill deadline for the two restart-storm regression tests (b.hka (e)).
#
# Both are `#[ignore]`d (`tests/integration/checkpoint/restart_storm_test.rs`)
# and are the nearest coverage of the object-id-collision property b.b2j fixed:
# 5000 CreateLayers across 100 simulated restarts. That workload legitimately
# runs ~146s, which is past the global 120s hard-kill above — so without this
# override they can only ever pass under plain `cargo test`, i.e. the one place
# with no hang kill-switch at all. Raising the deadline for exactly these two is
# the narrow fix; the global 120s stays where it is for the other ~600 tests.
#
# 60s × 5 = 300s: ~2× headroom over the measured 146s, which is the right margin
# for a test whose runtime is dominated by round trips to a Valkey that the rest
# of the suite is hammering concurrently.
#
# `retries = 0` overrides the profile-level `retries = 1`. The failure these
# tests detect (a duplicate object_id) is deterministic, not a contention blip,
# so a retry buys no signal — it just doubles a five-minute cost on a red run.
#
# This lives in the **default** profile deliberately, not `[profile.ci]`:
# nextest applies the default profile's overrides under `--profile ci` too (they
# merge with the ci overrides), so one entry covers CI and local/agent runs
# alike. A `[[profile.ci.overrides]]` copy would be dead weight that could drift.
#
# `test(=…)` is an exact match on the FULL binary-relative test name, module
# path included — a bare function name matches nothing and fails open (silently
# no override). Verify with:
#
#   cargo nextest list --profile ci -p live-edit --test integration \
#     --features test-support,test-fault-injection,test-checkpoint-fault-injection \
#     --run-ignored all -E '<filter>'
#
# The expected match set is exactly these two. The feature list is required, not
# optional polish: `restart_storm_test.rs` is
# `#![cfg(feature = "test-checkpoint-fault-injection")]`, so without it the file
# compiles to nothing and the command lists ZERO tests — which reads exactly
# like a filter that has drifted, and would send the next reader chasing a
# non-existent typo.
[[profile.default.overrides]]
filter = 'test(=checkpoint::restart_storm_test::no_object_id_collision_under_restart_storm) or test(=checkpoint::restart_storm_test::restart_storm_with_zero_safety_margin_surfaces_collision)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }
retries = 0

# Raise the kill deadline for every b.azh stream-reader test
# (`tests/integration/storage/stream_mux_reader_connect_test.rs`). Their WORST
# cases — every wait at its full bound, not their runtime — sit near or past the
# global 120s hard-kill, and a killed test prints nothing, so a genuine failure
# near its worst case would be lost. The module header's "Wait budget" section
# states the bound this deadline is sized on: each test's worst case, counting
# fred's 5s one-shot command bound and `TestValkey`'s drop-time key purge, is
# under 180s. On the healthy path each runs in a few seconds at most.
#
# The whole module, not a list of tests: a per-test list had to be re-derived
# from per-test arithmetic every time a wait was added, and missed tests that
# had crossed 120s. A test added to the module is covered with no edit here.
#
# 60s × 3 = 180s. `retries` stays at the profile's 1: these are short tests
# whose failures under load are the contention class the retry exists for.
#
# Default profile, so CI's `--profile ci` picks it up too (see the restart-storm
# entry above). Verify the match set — every test in the module — with:
#
#   cargo nextest list --profile ci -p live-edit --test integration \
#     --features test-support,test-fault-injection -E '<filter>'
#
# and compare it with the same command filtered on
# `test(/stream_mux_reader_connect_test/)`. Pass `test-fault-injection`: the
# file's `#[cfg(feature = "test-fault-injection")] mod faults` compiles to
# nothing without it, so the list is shorter, not wrong.
[[profile.default.overrides]]
filter = 'test(/^storage::stream_mux_reader_connect_test::/)'
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "5s" }

# The same deadline, for the same reason, for the b.19i stream-reader re-AUTH
# tests (`tests/integration/storage/stream_mux_reauth_test.rs`): the module
# header's "Waits" section sums each test's worst case, every wait at its full
# bound; the largest is 145s, past the global 120s hard-kill and under 180s.
# On the healthy path each runs in a second or two. 60s × 3 = 180s. Verify the
# match set with `cargo nextest list --profile ci -p live-edit --test
# integration --features test-support,test-fault-injection -E '<filter>'`; the
# file's `faults` module compiles to nothing without `test-fault-injection`.
[[profile.default.overrides]]
filter = 'test(/^storage::stream_mux_reauth_test::/)'
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "5s" }

# The same deadline, for the same reason, for the b.zt3 dead-connection tests
# (every `tests/integration/storage/b_zt3_*_test.rs` module): each module
# header's "Wait budget" section sums each test's worst case, every wait at its
# full bound; the largest is 165s (`b_zt3_scan_walk_test`'s one test), past
# the global 120s hard-kill and under 180s. On the healthy path each runs in
# under seven seconds. 60s × 3 = 180s.
# Verify the match set — every test in those modules — with `cargo nextest
# list --profile ci -p live-edit --test integration --features test-support
# -E '<filter>'`.
[[profile.default.overrides]]
filter = 'test(/^storage::b_zt3_/)'
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "5s" }

# Raise the kill deadline for b.tbw part one's multi-second whole-write tests:
# the at-limit `CreateLayer` of 99,999 entries and its catch-up
# (`tests/integration/grpc/delta_size_refusal_test.rs`, 35–45s unoptimised
# on a shared store), and every test of
# `tests/integration/storage/txn_timeout_test.rs`, which hold a transaction's
# reply for seconds on purpose and write up to 150,000 commands (2–31s each).
# Each test runs every step, its fixture's setup included, under ONE deadline
# from its first line; after it comes only teardown. Worst cases, each derived
# in its module header ("Wait budget" / "Size and time"):
#
#   txn_timeout_test, each test: 90s deadline
#     + the fixture's drop: 5s for its first unanswered purge step + 10s quit
#     = 105s, plus the purge's answered round trips;
#   the at-limit create: 150s deadline + 5s + 10s (the fixture's drop)
#     = 165s, plus the purge's answered round trips.
#
# The purge's round trips are one SCAN page per 100 keys of the whole shared
# database plus one UNLINK per 100 of the test's own keys (about 500 for the
# largest txn_timeout object, about 1,000 for the at-limit one), so they have
# no fixed bound. A stall a failed txn_timeout test leaves parked lasts until
# the test process exits or its BLPOP's 60s server-side timeout fires; it
# holds no fixture data-pool connection, and the quit is already bounded.
#
# The create's sits past the global 120s hard-kill, and the txn tests' leaves
# that kill only 15s for the unbounded purge; a killed test prints nothing.
# 60s × 4 = 240s. `retries` stays at the profile's 1: a failure under load is
# the contention class it exists for.
#
# Default profile, so CI's `--profile ci` picks it up too. Verify the match
# set — the one create test and every txn_timeout test — with:
#
#   cargo nextest list --profile ci -p live-edit --test integration \
#     --features test-support,test-fault-injection -E '<filter>'
#
# `txn_timeout_test` is `#[cfg(feature = "test-fault-injection")]`, so without
# that feature the list holds the create test alone.
[[profile.default.overrides]]
filter = 'test(=grpc::delta_size_refusal_test::create_layer_at_exactly_the_entry_limit_commits_and_its_catch_up_returns_every_entry) or test(/^storage::txn_timeout_test::/)'
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "5s" }

# Raise the kill deadline for the structural cache equivalence proptests
# (`tests/proptests.rs`, module `structural_cache_equivalence`): the one over
# two `LayerStore`s (b.dkt Epic 4 Task 7) and the one over two
# `LiveEditService`s (b.dkt Epic 6 Task 7), each its own test process.
#
# 256 Valkey-backed cases of two-replica commit histories with injected
# anomalies (trims, DR restores, rollbacks) run ~50–75s locally. A failing run
# then shrinks, bounded at 60s of wall time, plus at most one case past that
# bound: ~140s worst case, past the global 120s hard-kill. A SIGKILLed run
# prints nothing, so the minimal failing case — the one output a red run exists
# for — would be lost.
#
# 60s × 5 = 300s: ~2× headroom over the measured worst case, the margin the
# restart-storm entry above uses for the same reason (round trips to a Valkey
# the rest of the suite is hammering). The test's block doc carries the
# arithmetic; re-derive both if its case count, history length or shrink bound
# changes.
#
# `retries = 0` overrides the profile-level `retries = 1`. A retry draws a new
# seed, so a rare property failure would pass on TRY 2 and be reported FLAKY —
# a real counterexample hidden behind a contention verdict, and a failing run's
# cost paid twice.
#
# In the **default** profile for the reason given above: nextest applies
# default-profile overrides under `--profile ci` too.
#
# The fenced variant (`…_fenced_entries_…`, the same two-replica histories with
# the client ceilings lowered so every cold start and reload takes the fenced
# read) ran 112 s alone, so it shares the override.
#
# The `test(=…)` names are module-qualified. Verify the filter matches exactly
# these three tests:
#
#   cargo nextest list --profile ci -p live-edit --test proptests \
#     --features test-support -E '<filter>'
[[profile.default.overrides]]
filter = 'binary_id(live-edit::proptests) and (test(=structural_cache_equivalence::proptest_structural_cache_entries_equal_the_fresh_read_across_two_replica_histories) or test(=structural_cache_equivalence::proptest_structural_cache_entries_equal_the_fresh_read_across_two_service_histories) or test(=structural_cache_equivalence::proptest_structural_cache_fenced_entries_equal_the_fresh_read_across_two_replica_histories))'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }
retries = 0

# The same for the end-to-end keyspace-equivalence proptest (b.dkt Epic 6
# Task 7, `tests/proptests.rs`, module `structural_watch_equivalence`): 256
# Valkey-backed cases of one to four `update_layer` steps on a `lua` store and
# a `lua-watch-structural` store, each step dumping both objects' keyspaces.
# A passing run measured ~40 s locally; allow up to ~60 s on a loaded runner.
# A failing run adds shrinking, bounded at 60 s, plus at most one case past
# the bound (about a second): up to ~60 + 60 + 1 ≈ 121 s, just over the 120 s
# global hard-kill. 60s × 5 = 300 s is about 2.5× that. The raised kill keeps
# the minimal failing case from being SIGKILLed away, and
# `retries = 0` keeps a real counterexample from passing on a fresh seed and
# reading as FLAKY (both reasons as above). Verify the filter matches exactly
# this one test with the `cargo nextest list` command above.
[[profile.default.overrides]]
filter = 'binary_id(live-edit::proptests) and test(=structural_watch_equivalence::proptest_update_layer_on_lua_leaves_the_same_keyspace_as_lua_watch_structural)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }
retries = 0

# The same for the external-value GC ledger state machine (b.yuo Part R,
# `tests/proptests.rs`, module `gc_ledger_state_machine`, compiled only with
# the `test-fault-injection` feature): 256 Valkey-backed cases of commits,
# retirements, faults and GC passes. A passing run measured 11 s on a fast
# node and 102 s to over 120 s on loaded CI nodes, where it hit the default
# 120 s kill twice in two days. 60s × 5 = 300 s is about 2.5× the worst
# observed. `retries = 0` keeps a real counterexample from passing on a fresh
# seed and reading as FLAKY. Shrinking is unbounded here, unlike the
# structural proptests above: the test builds its runner with
# `proptest_config(256)`, which takes proptest 1.11.0's defaults,
# `max_shrink_time: 0` (no limit) and `max_shrink_iters: u32::MAX`, so a red
# run can still exceed the kill. Verify the filter matches exactly this one
# test:
#
#   cargo nextest list --profile ci -p live-edit --test proptests \
#     --features test-support,test-fault-injection -E '<filter>'
#
# (without `test-fault-injection` the module is not compiled and the list is
# empty).
[[profile.default.overrides]]
filter = 'binary_id(live-edit::proptests) and test(=gc_ledger_state_machine::proptest_gc_ledger_applies_each_release_exactly_once_and_balances_its_bytes)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }
retries = 0

# Keep the output of the structural cache's weight-estimate calibration tests
# when they pass. Each prints one `CALIBRATION estimate_state_bytes …` line —
# the estimate's measured error against jemalloc, which Epic 4 of plan b.dkt
# requires recorded — and the default discards it for a passing test.
# `immediate-final` prints it inline and again in the final summary;
# `store-success-output` keeps it in the JUnit XML. In the default profile for
# the reason given above: one entry covers CI and local/agent runs.
#
# The tests live in the `live-edit` bin target (only the binary allocates
# through jemalloc). Verify with:
#
#   cargo nextest list -p live-edit --bin live-edit \
#     -E 'binary_id(live-edit::bin/live-edit) and test(/^allocator::structural_cache_calibration::/)'
#
# The expected match set is exactly the five tests of
# `src/allocator/structural_cache_calibration.rs` (on linux-gnu; elsewhere the
# module is not compiled and the set is empty).
[[profile.default.overrides]]
filter = 'binary_id(live-edit::bin/live-edit) and test(/^allocator::structural_cache_calibration::/)'
success-output = "immediate-final"
junit = { store-success-output = true }

# The two `#[ignore]`d crash-scale presence sweep burst measurements
# (`tests/integration/grpc/presence_sweep_relay_burst_test.rs`, demo and mixed
# sessions), run explicitly with `--run-ignored all`; the third shape,
# full-batch sessions, runs in the default suite (its own entry below). Each
# sets up
# thousands of JoinSession streams before its one sweep pass, under an in-test
# 280 s deadline, so the kill deadline is 60s × 5 = 300s with retries off (a
# second run doubles the cost and a lag is a finding, not a blip). Each exists
# to report its numbers — the burst rate, the pass, each relay's lag — so its
# output is kept when it passes, inline and in the final summary, and in the
# JUnit XML. Exactly these two; verify with
# `cargo nextest list --profile ci -p live-edit --test integration --features test-support,test-fault-injection --run-ignored all -E '<filter>'`
# (without `test-fault-injection` the file compiles to nothing and the list is
# empty).
[[profile.default.overrides]]
filter = 'test(=grpc::presence_sweep_relay_burst_test::sweep_burst_at_crash_scale_in_demo_sessions_reaches_every_observer_without_relay_lag) or test(=grpc::presence_sweep_relay_burst_test::sweep_burst_at_crash_scale_in_mixed_sessions_reaches_every_observer_without_relay_lag)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }
retries = 0
success-output = "immediate-final"
junit = { store-success-output = true }

# The default-suite shape of the same file (full-batch sessions), under the
# global deadline. Its report — burst rate, pass time, each relay's lag — is
# kept when it passes, inline, in the final summary and in the JUnit XML.
# `retries = 0`: a relay lag here is a lost presence event, not a contention
# blip, and the measured headroom is wide (no lag down to a 128-message channel
# under a parallel presence-test load, 32× below the production 4096), so a
# one-off lag must fail visibly rather than pass on retry. Exactly this one;
# verify with the `nextest list` command above.
[[profile.default.overrides]]
filter = 'test(=grpc::presence_sweep_relay_burst_test::sweep_burst_at_crash_scale_in_full_batch_sessions_reaches_every_observer_without_relay_lag)'
retries = 0
success-output = "immediate-final"
junit = { store-success-output = true }

# The upload memory envelope (b.715 T7, `tests/upload_memory_envelope/`) keeps
# its output on a PASS: each measuring test prints the measured peaks, the fitted
# per-path coefficients, the parse-only ratios or the allocation census the
# `grpc::upload_admission` charge constants are set from, and that report is
# the reason to read the run when the constants are re-derived (the I5
# external-value censuses print their counts too). `retries = 0`: it counts
# allocations, not time. The bounds are deterministic: on the WATCH path the
# dense fixtures' queues grow with Valkey's reply timing, but b.26e Stage 2
# charges their worst case (next-power-of-two slots of every queue at once),
# so no fixture's bound depends on timing; the I5
# live-copy peak depends on scheduling (8 or 9 measured), but its census
# asserts the derived bound — the store's in-flight bound plus one finished
# copy per router thread — which no scheduling can pass, so a failure means a
# bound broke and a retry would only double the runtime. The one bound that
# moves with scheduling is the M3 arms' high-water bound, whose in-budget
# high-water counts the receive allowances of however many calls are admitted
# at once; a retry could only hide a failure there, and each arm's per-phase
# check, against the gate total in force, does not move with it. In the default
# profile, so it covers CI's
# `--profile ci` runs too (see the restart-storm entry above). The filter
# matches the binary — with `--features test-support`, exactly ninety-seven live
# tests (the cluster-gated ones print a `SKIP:` line and pass without
# `LIVE_EDIT_TEST_CLUSTER_URL`), among them the fourteen b.26e large-base
# reproducers, the full WATCH envelope set, the four M3 demo arms and
# thirty-three b.fsz tests (fourteen stream-repair handler rows, six audit
# envelope rows, eleven RP2 scratch rows, the long-list listing pin and the
# audit compare's bound), plus
# twenty-three `#[ignore]`d ones that run only under `--run-ignored`: fifteen
# b.26e reports (eight per-phase attribution reports, the WATCH long-reorder
# report, the object-state segments, plans per commit, the cached-route plan
# rows, the post-release cases over chosen pools, the in-flight slot report
# and the cached-route residue report), three b.ug2 reports (the cached-route
# element shapes, the fast-path element sizes and the depth walks), the three
# M3 stress arms and the two b.fsz fit reports (the stream-repair segments and
# the per-record growth); with
# `--features test-fault-injection` as well, four more live tests (the stalled
# WATCH set) and two more reports (the stalled WATCH commit queue and the
# b.ug2 rollback-after-CR2 arms). Verify
# with `cargo nextest list -p live-edit --features test-support -E
# 'binary(upload_memory_envelope)'`, with `--run-ignored only` for the
# ignored ones, and both again with `--features test-support,test-fault-injection`.
[[profile.default.overrides]]
filter = 'binary(upload_memory_envelope)'
success-output = "immediate-final"
junit = { store-success-output = true }
retries = 0

# The presence fan-out memory regression (`tests/presence_memory/`) keeps its
# output on a PASS for the same reason: each test prints the measured bytes
# per idle session, per capacity and per undelivered event that its bounds are
# set from, which is what to read when a bound is re-derived. `retries = 0`:
# it counts allocations, not time, and its tolerances cover the one varying
# input (where the router's table hashes each session), so a failure means a
# bound broke. In the default profile, so it covers `--profile ci` too. The
# filter matches the binary — exactly three tests; verify with
