[project]
name = "live-edit-conformance-tests"
version = "0.1.0"
description = "Black-box conformance tests for the Omniverse LiveService API"
requires-python = ">=3.12"
dependencies = [
  "grpcio==1.76.0",
  "grpcio-health-checking==1.76.0",
  "protobuf==6.33.5",
  "pytest==8.4.2",
  "pytest-timeout==2.4.0",
]

[project.scripts]
run-conformance-tests = "live_edit_conformance.runner:main"

[dependency-groups]
dev = ["grpcio-tools==1.76.0", "ruff==0.12.12", "pyyaml==6.0.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_edit_conformance", "src/nvidia"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
exclude = ["src/nvidia"]
