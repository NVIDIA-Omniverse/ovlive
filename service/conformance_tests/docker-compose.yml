services:
  valkey:
    image: valkey/valkey:8.1.3
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 60
  service:
    image: ${SERVICE_IMAGE:?Set SERVICE_IMAGE to the image under test}
    environment:
      LIVE_EDIT_VALKEY_URL: redis://valkey:6379
      LIVE_EDIT_AUTHN_ENABLED: "true"
      LIVE_EDIT_AUTHZ_ENABLED: "false"
      LIVE_EDIT_USERINFO_SERVICE_ENABLED: "false"
      # Isolated test stack only: decode the bundled unsigned JWT locally.
      LIVE_EDIT_TEST_ONLY_DANGEROUSLY_ALLOW_UNVALIDATED_TOKENS: "true"
      LIVE_EDIT_VALKEY_POOL_SIZE: "8"
      LIVE_EDIT_SUBSCRIBER_POOL_SIZE: "4"
      # A short client keepalive interval, so the keepalive case's silent join
      # ends within seconds (three intervals) rather than the default's 45 s.
      LIVE_EDIT_PRESENCE_KEEPALIVE_INTERVAL_MS: "1000"
      LIVE_EDIT_CHECKPOINT_ENABLED: "false"
    depends_on:
      valkey:
        condition: service_healthy
  conformance:
    image: ${CONFORMANCE_IMAGE:?Set CONFORMANCE_IMAGE}
    environment:
      CONFORMANCE_GRPC_ENDPOINT: http://service:50001
      CONFORMANCE_AUTH_TOKEN_FILE: /opt/local-test-token.jwt
      CONFORMANCE_BASE_PATH: https://example.test/conformance/base.usda
    depends_on:
      service:
        condition: service_started
    command: ["--profile", "deployment"]
