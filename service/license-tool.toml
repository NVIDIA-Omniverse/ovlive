[overrides]
# `smartstring` (transitive dep of `opentelemetry-prometheus-text-exporter`)
# declares the nonstandard SPDX expression `MPL-2.0+` in its Cargo.toml. The
# canonical license is MPL-2.0 (a weak, file-level copyleft license in this
# repo's allowed set); the `+` operator is not a valid MPL suffix and breaks
# both the SPDX
# text lookup and the permissive-set check in tools/generate_attributions.py.
# Normalize to the canonical identifier.
smartstring = { license = "MPL-2.0" }
# `tikv-jemalloc-sys` declares `MIT/Apache-2.0`, which covers the Rust binding
# only. The crate also compiles jemalloc's C sources into the service binary
# (its global allocator), and jemalloc is BSD-2-Clause. Declare the conjunction
# so the attribution's license line covers what is actually linked;
# tools/generate_attributions.py emits jemalloc's notice from the crate's
# `jemalloc/COPYING` (EMBEDDED_LICENSE_FILES).
tikv-jemalloc-sys = { license = "(MIT OR Apache-2.0) AND BSD-2-Clause" }
