# The replica autoscaler that `live-edit scaler` runs. A separate crate so the
# compiler enforces that the scaler never reaches the service's storage, gRPC,
# domain or auth modules: it depends on no `live-edit` code at all, and
# `live-edit` depends on it (for the dispatch in `src/main.rs` and the shared
# `/scaling/v1` wire type). Its tests need no Valkey.
#
# Every dependency below is already in the workspace's `Cargo.lock` through
# `live-edit`; this crate adds no new external crate. `reqwest` keeps
# `default-features = false` with `rustls-tls` only, the same shape as
# `live-edit`'s entry, so the single `ring` rustls crypto provider invariant
# (`scripts/check-crypto-provider-invariant.sh`) is unchanged.
[package]
name = "live-edit-scaler"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "live_edit_scaler"

[dependencies]
axum = "0.7"
futures = "0.3"
opentelemetry = { version = "0.31", features = ["metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["metrics"] }
opentelemetry-prometheus-text-exporter = "0.2.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
# Test-only, and like the dependencies above already in the workspace's
# `Cargo.lock` through `live-edit`: `tempfile` holds the service-account token
# file the API-client tests rotate, and `tracing-subscriber` captures the
# scaler's WARN lines in the poll-loop tests.
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["json"] }
wiremock = "0.6"
