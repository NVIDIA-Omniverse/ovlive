{{- /*
  Rendered ONLY when the chart owns the ServiceAccount: create=true AND no
  operator-supplied name. A supplied serviceAccount.name means "use a
  pre-provisioned SA, don't touch it" — rendering an SA object over a
  pre-existing one fails `helm upgrade` with invalid-ownership-metadata.

  Never write a literal comment-close sequence inside this comment — it
  terminates the comment early and leaks text into the manifest.
*/}}
{{- if and .Values.serviceAccount.create (not .Values.serviceAccount.name) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "live-edit-service.serviceAccountName" . }}
  labels:
    {{- include "live-edit-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
