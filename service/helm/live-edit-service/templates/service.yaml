apiVersion: v1
kind: Service
metadata:
  name: {{ include "live-edit-service.servicename" . }}
  labels:
    {{- include "live-edit-service.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.grpc.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      # appProtocol hints to clients (Service Mesh, Gateway API impls, monitoring
      # sidecars) that this port speaks plaintext HTTP/2 (gRPC over h2c).
      # Required for some mesh integrations (Linkerd, Istio) to enable gRPC-aware
      # load balancing instead of L4-only proxying.
      appProtocol: kubernetes.io/h2c
    - port: {{ .Values.service.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
      # appProtocol hints that this port serves a Prometheus-style HTTP/1.1
      # scrape endpoint, helping mesh integrations route /metrics correctly.
      appProtocol: http
  selector:
    {{- include "live-edit-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
