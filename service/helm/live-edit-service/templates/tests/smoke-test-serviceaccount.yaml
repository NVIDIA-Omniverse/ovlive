{{- /*
  Rendered ONLY when the chart owns the smoke-test ServiceAccount: create=true
  AND no operator-supplied name (a supplied tests.serviceAccount.name means
  "use a pre-provisioned SA, don't touch it" — same semantics as the main
  serviceAccount block).
*/ -}}
{{- if and .Values.tests.enabled .Values.tests.serviceAccount.create (not .Values.tests.serviceAccount.name) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "live-edit-service.smokeTestServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "live-edit-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test,post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.tests.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.tests.serviceAccount.automount }}
{{- end }}
