image:
  repository: nvcr.io/nvidia/omniverse/live-edit-conformance-tests
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
service:
  endpoint: "http://live-edit-service:50001"
  # Existing base layer for which the supplied principal has read/write access.
  basePath: ""
  peerEndpoint: ""
  deniedPath: ""
  # Optional deployment adapter: provision a UUID-named base file under basePath.
  storageEndpoint: ""
auth:
  existingSecret: ""
  key: token
  sidecar: {}
  serviceAccountAnnotations: {}
tls:
  existingSecret: ""
  key: ca.crt
profiles: [deployment]
timeouts:
  request: 15
  readiness: 120
activeDeadlineSeconds: 900
ttlSecondsAfterFinished: 86400
serviceAccountName: ""
# app.kubernetes.io/name is omitted from pods to exclude test clients from
# service Deployment selectors, including when podLabels are copied from servers.
podLabels: {}
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
